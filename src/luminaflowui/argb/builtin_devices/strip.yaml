# Built-in ARGB device definition.
# `leds` holds one shape per LED; the list position is the LED index used
# by effects, masks and the header chain order. LED fills come from the
# effect engine (shape outline is optional); `decor` is non-LED artwork
# (case, housing, blades) drawn underneath the LEDs.

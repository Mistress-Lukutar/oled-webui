# Reusable "ring counter": a ring gauge with a number in the center.
# Place in a scene with:
#   - use: ring-counter
#     at: [x, y]              # placement of the 160x160 box
#     source: cpu             # data source (0..100)
#     value: "{value:.0f}%"   # optional text template
#     palette: { stroke_color: "...", fill_color: "..." }  # optional colors

params:
  source: cpu
  value: "{value:.0f}%"
  palette:
    stroke_color: "#7CFC00"
    fill_color: "#222222"

render:
  - type: ring
    rect: [0, 0, 160, 160]
    source: "{{ source }}"
    style:
      stroke_color: "{{ palette.stroke_color }}"
      fill_color: "{{ palette.fill_color }}"
      stroke_width: 10
  - type: text
    rect: [0, 0, 160, 160]
    align: center
    source: "{{ source }}"
    value: "{{ value }}"
    style:
      size: 40
      fill_color: "{{ palette.stroke_color }}"
